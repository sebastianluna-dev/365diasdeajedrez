# The two databases of the project, on the machine, for development.
#
# The app reads two Postgres databases that share no tables: the CMS's
# (`DATABASE_URI`) and the platform's (`PLATFORM_DATABASE_URL`). In production
# they are two managed databases; here they are two databases of one server,
# which is the same thing for the app and one container instead of two.
#
#   docker compose up -d      start it (the data survives)
#   docker compose down       stop it (the data survives)
#   docker compose down -v    stop it and THROW THE DATA AWAY
#
# The version is pinned to the one the managed databases run, so a dump taken
# there restores here without a word about it.
services:
  postgres:
    image: postgres:17.2-alpine
    container_name: 365-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ajedrez
      POSTGRES_PASSWORD: ajedrez
      # The first database. The second one is created by the script below,
      # which Postgres runs once, when the volume is empty.
      POSTGRES_DB: plataforma
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `-d plataforma` and not the default: without it pg_isready asks for a
      # database named after the user, which does not exist.
      test: ["CMD-SHELL", "pg_isready -U ajedrez -d plataforma"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
