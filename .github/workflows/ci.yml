# Lint, types and tests on every push and pull request. No `next build`: static
# generation queries Payload and the platform, and CI has neither database; the
# deployment is what validates the build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # `prisma generate` only needs the URL to exist in order to read
      # prisma.config.ts; it does not connect.
      PLATFORM_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
